<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asesoramiento en Trámites</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f4f6f9;
color:#333;
}

header{
background:linear-gradient(135deg,#0d6efd,#0047b3);
color:white;
text-align:center;
padding:60px 20px;
}

header h1{
font-size:2.5rem;
margin-bottom:10px;
}

header p{
font-size:1.2rem;
}

.btn{
display:inline-block;
background:#25D366;
color:white;
padding:15px 30px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
margin-top:20px;
}

section{
max-width:1200px;
margin:auto;
padding:50px 20px;
}

h2{
text-align:center;
color:#0d6efd;
margin-bottom:30px;
}

.servicios{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.card h3{
margin-bottom:10px;
}

.faq{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.contacto{
background:white;
padding:30px;
border-radius:15px;
